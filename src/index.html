<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Zawo</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="renderer.css"></head>
<body data-view="hosts"><!-- THESIS: A continuous workspace with a generous sidebar, inspired by Find My.
OWN-WORLD: Gray-white material, soft green and blue accents, white selected controls, no hard sidebar seam.
STORY: Choose a library section, find a connection, work in a terminal or docked editor.
FIRST VIEWPORT: 264px sidebar, 64px continuous header, 32px content insets and a full-height workspace.
FORM: User-pinned Find My reference; code-led adaptation. Keep logo, sessions and existing actions.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
--><div id="app">
<header class="topbar"><div class="window-space"></div><div class="library-tabs" role="group" aria-label="Workspace views"><button class="top-tab active" data-view="hosts"><span data-icon="vault"></span>Vaults</button><button class="top-tab" data-view="sftp"><span data-icon="folder"></span>SFTP</button></div><div id="terminal-tabs"></div><button class="top-plus" id="new-tab" title="New Tab" aria-label="New Tab">+</button><button id="toggle-browser" class="icon-button" aria-label="Open browser panel" aria-expanded="false" title="Browser · ⌘⇧B"><span data-icon="globe"></span></button><div class="top-brand" title="Zawo __ZAWO_VERSION__ · local workspace">ZAWO</div></header>
<div class="app-body"><aside class="sidebar"><h2 class="sidebar-heading">Library</h2><nav aria-label="Library"><button class="nav-item active" data-view="hosts"><span data-icon="server"></span>Hosts<span id="host-count" class="sr-only">0</span></button><button class="nav-item" data-view="keychain"><span data-icon="key"></span>Keychain</button><button class="nav-item" data-view="forwarding"><span data-icon="forward"></span>Port Forwarding</button><button class="nav-item" data-view="snippets"><span data-icon="snippet"></span>Snippets</button><button class="nav-item" data-view="known"><span data-icon="fingerprint"></span>Known Hosts</button><button class="nav-item" data-view="activity"><span data-icon="clock"></span>Logs</button></nav><div class="group-heading"><button data-view="groups">Groups</button><button id="sidebar-add-group" aria-label="New group" title="New group">+</button></div><div id="group-nav"></div><button id="keyboard-shortcuts" class="shortcut-link">Keyboard Shortcuts <kbd>⌘⇧/</kbd></button><div class="version" title="Zawo __ZAWO_VERSION__">Zawo <span>__ZAWO_VERSION__</span></div></aside>
<main id="management"><div class="quickbar"><form id="quick-form"><input id="search" autocomplete="off" placeholder="Find a host or ssh user@hostname..." aria-label="Search hosts or quick connect"><button id="quick-connect" type="button">Connect</button></form></div><div id="page"></div></main>
<section id="new-tab-page" hidden aria-label="New Tab"></section>
<section id="terminal-workspace" hidden><div id="terminal-stage"></div></section></div>
<footer class="sr-only"><span id="footer-status">Your workspace stays on this Mac</span><span id="session-count">0 active sessions</span></footer></div>
<div id="drawer-layer" hidden></div><dialog id="modal"></dialog><div id="toast" role="status" hidden></div><script src="renderer.js"></script></body></html>
